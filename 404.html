<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面走丢啦 · 一碗饭blog</title>
  <style>
    :root { color-scheme: light; --pink: #f79dbc; --pink-deep: #e987a9; --ink: #5b4d55; --muted: #95858e; --paper: #fff; --blush: #fff2f7; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; overflow: hidden; padding: 24px; color: var(--ink); font-family: "LXGW WenKai", "Microsoft YaHei", system-ui, sans-serif; background: linear-gradient(145deg, #fff 0%, var(--blush) 100%); }
    body::before, body::after { position: fixed; z-index: -1; width: 26rem; height: 26rem; border-radius: 50%; content: ""; background: rgba(247,157,188,.18); filter: blur(2px); }
    body::before { top: -13rem; left: -9rem; }
    body::after { right: -12rem; bottom: -14rem; background: rgba(255,210,226,.4); }
    main { width: min(100%, 680px); padding: clamp(32px, 7vw, 72px) clamp(24px, 8vw, 80px); text-align: center; border: 1px solid rgba(247,157,188,.28); border-radius: 32px; background: rgba(255,255,255,.86); box-shadow: 0 22px 70px rgba(200,133,160,.18); backdrop-filter: blur(10px); }
    .mascot { display: grid; place-items: center; width: 116px; height: 116px; margin: 0 auto 22px; border-radius: 42% 58% 55% 45%; color: #fff; font-size: 3.5rem; background: linear-gradient(145deg, #ffc9dc, var(--pink)); box-shadow: 0 12px 24px rgba(233,135,169,.3); transform: rotate(-7deg); }
    .mascot span { transform: rotate(7deg); }
    .code { margin: 0; color: var(--pink-deep); font: 800 clamp(4.5rem, 18vw, 8rem)/.9 ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif; letter-spacing: .04em; }
    h1 { margin: 20px 0 10px; font-size: clamp(1.45rem, 4vw, 2rem); font-weight: 700; }
    p { margin: 0 auto; max-width: 30rem; color: var(--muted); font-size: 1rem; line-height: 1.8; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-width: 132px; padding: 11px 20px; border: 1px solid var(--pink); border-radius: 999px; color: var(--pink-deep); font-weight: 700; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
    a.primary { color: #fff; background: var(--pink); box-shadow: 0 7px 16px rgba(233,135,169,.25); }
    a:hover, a:focus-visible { outline: none; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(233,135,169,.25); }
    a:not(.primary):hover, a:not(.primary):focus-visible { background: #fff5f8; }
    .hint { margin-top: 22px; color: #b39da8; font-size: .85rem; }
    @media (prefers-reduced-motion: no-preference) { .mascot { animation: float 3.2s ease-in-out infinite; } @keyframes float { 50% { transform: translateY(-7px) rotate(-4deg); } } }
  </style>
</head>
<body>
  <main>
    <div class="mascot" aria-hidden="true"><span>૮ ˶ᵔ ᵕ ᵔ˶ ა</span></div>
    <div class="code" aria-label="404">404</div>
    <h1>哎呀，页面走丢啦</h1>
    <p>你要找的内容可能被搬家了，或者暂时躲起来休息。回到首页继续逛逛吧！</p>
    <div class="actions">
      <a class="primary" href="/">返回首页</a>
      <a href="javascript:history.back()">返回上一页</a>
    </div>
    <div class="hint">愿你今天也遇见可爱的事 ♡</div>
  </main>
  <script>
    (function () {
      var back = document.querySelector('a[href="javascript:history.back()"]');
      if (back) back.addEventListener('click', function (event) {
        if (history.length < 2) { event.preventDefault(); location.href = '/'; }
      });
    }());
  </script>
</body>
</html>
