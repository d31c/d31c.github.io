<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>炸飞机 · 人机对战</title>
<script src="engine.js"></script>
<style>
  :root {
    --bg: #101722;
    --panel: #1b2638;
    --panel-2: #22314a;
    --line: #33445f;
    --text: #e8eef7;
    --muted: #8fa3bd;
    --water: #2b3b52;
    --water-hi: #3a4f6c;
    --plane: #4f9de0;
    --plane-head: #ff7043;
    --miss: #8395a7;
    --body-hit: #3ddc84;
    --head-hit: #ff4d4d;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1d2c44 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 18px; }
  header h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

  .phase-label {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--panel-2);
    color: var(--accent);
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  .layout-grid { display: grid; grid-template-columns: auto 300px; gap: 18px; align-items: start; }
  .battle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
  @media (max-width: 780px) {
    .layout-grid, .battle-grid { grid-template-columns: 1fr; }
  }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .board-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .board-title b { font-size: 15px; }
  .board-title .score { color: var(--accent); font-size: 13px; }

  .board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 2px;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #0c131f;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px;
  }
  .board-frame {
    display: grid;
    grid-template-columns: 20px 1fr;
    grid-template-rows: 20px 1fr;
    gap: 3px;
  }
  .board-frame .corner { grid-area: 1 / 1; }
  .board-frame .col-labels {
    grid-area: 1 / 2;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 2px;
    padding: 0 2px;
  }
  .board-frame .row-labels {
    grid-area: 2 / 1;
    display: grid;
    grid-template-rows: repeat(10, 1fr);
    gap: 2px;
    padding: 2px 0;
  }
  .board-frame .board { grid-area: 2 / 2; }
  .board-frame .col-labels div,
  .board-frame .row-labels div {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }
  .cell {
    position: relative;
    background: var(--water);
    border-radius: 3px;
    cursor: default;
    transition: background .12s, transform .08s;
  }
  .cell.clickable { cursor: pointer; }
  .cell.clickable:hover { background: var(--water-hi); transform: translateY(-1px); }

  .cell.plane-body { background: var(--plane); }
  .cell.plane-head { background: var(--plane-head); }
  .cell.plane-head.hit::after { display: none; }
  .cell.plane-head::after {
    content: "";
    position: absolute; inset: 0; margin: auto;
    width: 45%; height: 45%;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
  }
  .cell.sel { outline: 3px solid #fff; outline-offset: -1px; z-index: 2; }
  .cell.overlap { outline: 2px solid #ff3860; outline-offset: -1px; box-shadow: inset 0 0 0 999px rgba(255,56,96,.38); }

  .cell.hit { overflow: hidden; }
  .cell.hit::before {
    content: "";
    position: absolute; inset: 0; margin: auto;
    width: 46%; height: 46%;
    border-radius: 50%;
  }
  .cell.miss::before { background: var(--miss); }
  .cell.body-hit::before { background: var(--body-hit); box-shadow: 0 0 8px rgba(61,220,132,.8); }
  .cell.head-hit::before { background: var(--head-hit); box-shadow: 0 0 10px rgba(255,77,77,.9); }

  .controls { display: flex; flex-direction: column; gap: 14px; }
  .ctrl-label { color: var(--muted); font-size: 12px; letter-spacing: 1px; }
  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 9px;
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    transition: background .12s, transform .06s;
  }
  .btn:hover { background: #2d4162; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: #ffb03a; border-color: #ffb03a; color: #241a05; font-weight: 700; }
  .btn.primary:hover { background: #ffc05c; }
  .btn.primary:disabled { background: #5a5f6b; border-color: #5a5f6b; color: #c9ced6; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 40px);
    gap: 6px;
    justify-content: center;
    margin: 0 auto;
  }
  .dpad button {
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }
  .dpad button:hover { background: #2d4162; }
  .dpad .up { grid-area: 1 / 2; }
  .dpad .left { grid-area: 2 / 1; }
  .dpad .rotate-btn { grid-area: 2 / 2; border-radius: 50%; font-size: 20px; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down { grid-area: 3 / 2; }

  .legend { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .legend .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .legend .dot.gray { background: var(--miss); }
  .legend .dot.green { background: var(--body-hit); }
  .legend .dot.red { background: var(--head-hit); }
  .legend .plane-swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .legend .sw-head { background: var(--plane-head); }
  .legend .sw-body { background: var(--plane); }

  .status {
    text-align: center;
    font-size: 16px;
    padding: 12px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .status .turn { font-weight: 700; color: var(--accent); }

  .log { font-size: 12px; color: var(--muted); height: 130px; overflow: auto; margin-top: 10px; line-height: 1.7; }
  .log div { border-bottom: 1px dashed #22304a; padding: 2px 0; }
  .log .me { color: #9fd0ff; }
  .log .cpu { color: #ffd9a0; }
  .log .red { color: var(--head-hit); }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(6,10,18,.78);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .overlay.hidden { display: none; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 30px 34px; text-align: center; max-width: 380px; }
  .modal h2 { margin: 0 0 10px; }
  .modal .result { font-size: 42px; margin: 4px 0 6px; }
  .modal p { color: var(--muted); font-size: 14px; }

  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  select.btn { cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>炸飞机</h1>
    <p>人机对战 · 率先击落对方 3 架飞机的机头者获胜</p>
  </header>

  <div id="layoutPhase">
    <div class="phase-label">布局阶段</div>
    <div class="layout-grid">
      <div class="card">
        <div class="board-title">
          <b>我方棋盘</b>
          <span class="score" id="layoutPlaneInfo">第 1 架</span>
        </div>
        <div class="board-frame">
          <div class="corner"></div>
          <div class="col-labels"></div>
          <div class="row-labels"></div>
          <div class="board" id="layoutBoard"></div>
        </div>
        <div class="hint">点击一架飞机以选中它，用方向键 / 右侧按钮移动，圆圈按钮旋转方向。</div>
      </div>

      <div class="card controls">
        <div>
          <div class="ctrl-label">移动与旋转</div>
          <div class="dpad">
            <button class="up" data-move="up">↑</button>
            <button class="left" data-move="left">←</button>
            <button class="rotate-btn" id="rotateBtn" title="旋转方向">⟳</button>
            <button class="right" data-move="right">→</button>
            <button class="down" data-move="down">↓</button>
          </div>
        </div>

        <div class="row">
          <button class="btn" id="randomBtn">随机排列</button>
          <button class="btn primary" id="confirmBtn">确认布局</button>
        </div>

        <div class="legend">
          <div><span class="plane-swatch sw-head"></span>机头（被击中即击落整架飞机）</div>
          <div><span class="plane-swatch sw-body"></span>机身</div>
          <div style="margin-top:6px">反馈标记：<br>
            <span class="dot gray"></span>灰色 · 未击中　
            <span class="dot green"></span>绿色 · 击中机身　
            <span class="dot red"></span>红色 · 击中机头
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="battlePhase" style="display:none">
    <div class="phase-label">战斗阶段</div>
    <div class="status" id="statusBar"></div>
    <div class="battle-grid">
      <div class="card">
        <div class="board-title">
          <b>我方棋盘</b>
          <span class="score" id="myScore">机头 0/3</span>
        </div>
        <div class="board-frame">
          <div class="corner"></div>
          <div class="col-labels"></div>
          <div class="row-labels"></div>
          <div class="board" id="myBoard"></div>
        </div>
        <div class="hint">电脑轰炸你飞机的结果</div>
      </div>
      <div class="card">
        <div class="board-title">
          <b>敌方棋盘</b>
          <span class="score" id="enemyScore">机头 0/3</span>
        </div>
        <div class="board-frame">
          <div class="corner"></div>
          <div class="col-labels"></div>
          <div class="row-labels"></div>
          <div class="board" id="enemyBoard"></div>
        </div>
        <div class="hint">轮到你了就点击敌方棋盘进行轰炸</div>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="board-title"><b>战斗记录</b></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <div class="result" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">你赢了！</h2>
    <p id="resultDetail"></p>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="againBtn">再来一局</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var Z = window.ZFJ;
  var COLS = 'ABCDEFGHIJ';
  function label(idx) { return COLS[idx % 10] + (Math.floor(idx / 10) + 1); }

  function initBoardLabels() {
    var colHtml = '';
    var rowHtml = '';
    for (var i = 0; i < 10; i++) colHtml += '<div>' + COLS[i] + '</div>';
    for (var r = 0; r < 10; r++) rowHtml += '<div>' + (r + 1) + '</div>';
    document.querySelectorAll('.board-frame .col-labels').forEach(function (el) {
      el.innerHTML = colHtml;
    });
    document.querySelectorAll('.board-frame .row-labels').forEach(function (el) {
      el.innerHTML = rowHtml;
    });
  }

  var state = {
    phase: 'layout',
    planes: [],
    selected: 0,
    turn: 'player',
    adapter: null,
    ai: null,
    playerHeads: 0,
    computerHeads: 0,
    enemy: {},   // player's bombs on the adapter
    mine: {},    // computer's bombs on the player
    busy: false,
    log: []
  };

  var el = {
    layoutPhase: document.getElementById('layoutPhase'),
    battlePhase: document.getElementById('battlePhase'),
    layoutBoard: document.getElementById('layoutBoard'),
    layoutPlaneInfo: document.getElementById('layoutPlaneInfo'),
    myBoard: document.getElementById('myBoard'),
    enemyBoard: document.getElementById('enemyBoard'),
    statusBar: document.getElementById('statusBar'),
    myScore: document.getElementById('myScore'),
    enemyScore: document.getElementById('enemyScore'),
    log: document.getElementById('log'),
    overlay: document.getElementById('overlay'),
    resultEmoji: document.getElementById('resultEmoji'),
    resultTitle: document.getElementById('resultTitle'),
    resultDetail: document.getElementById('resultDetail')
  };

  function resetToLayout() {
    state.phase = 'layout';
    state.planes = Z.randomLayout();
    state.selected = 0;
    state.enemy = {};
    state.mine = {};
    state.playerHeads = 0;
    state.computerHeads = 0;
    state.busy = false;
    state.log = [];
    el.layoutPhase.style.display = 'block';
    el.battlePhase.style.display = 'none';
    el.overlay.classList.add('hidden');
    renderLayout();
  }

  function planeCellMap(planes) {
    var map = {};
    for (var i = 0; i < planes.length; i++) {
      var p = planes[i];
      for (var j = 0; j < p.cells.length; j++) {
        map[p.cells[j]] = { type: p.cells[j] === p.headIdx ? 'head' : 'body', plane: i };
      }
    }
    return map;
  }

  function overlapCellSet(planes) {
    var seen = {};
    var dup = {};
    for (var i = 0; i < planes.length; i++) {
      for (var j = 0; j < planes[i].cells.length; j++) {
        var c = planes[i].cells[j];
        if (seen[c]) dup[c] = true;
        seen[c] = true;
      }
    }
    return dup;
  }

  function renderLayout() {
    var map = planeCellMap(state.planes);
    var dup = overlapCellSet(state.planes);
    var overlapping = Z.hasOverlap(state.planes);
    var html = '';
    for (var i = 0; i < Z.CELL_COUNT; i++) {
      var cls = 'cell';
      if (map[i]) {
        cls += map[i].type === 'head' ? ' plane-head' : ' plane-body';
        if (map[i].plane === state.selected) cls += ' sel';
        if (dup[i]) cls += ' overlap';
      }
      html += '<div class="' + cls + '" data-idx="' + i + '"></div>';
    }
    el.layoutBoard.innerHTML = html;
    el.layoutPlaneInfo.textContent = '第 ' + (state.selected + 1) + ' 架' + (overlapping ? ' · 有重叠' : '');
  }

  function renderBattle() {
    var map = planeCellMap(state.planes);
    var canBomb = state.phase === 'battle' && state.turn === 'player' && !state.busy;
    var myHtml = '';
    for (var i = 0; i < Z.CELL_COUNT; i++) {
      var cls = 'cell';
      if (map[i]) cls += map[i].type === 'head' ? ' plane-head' : ' plane-body';
      var m = state.mine[i];
      if (m) cls += ' hit ' + (m === 'E' ? 'miss' : m === 'B' ? 'body-hit' : 'head-hit');
      myHtml += '<div class="' + cls + '" data-idx="' + i + '"></div>';
    }
    el.myBoard.innerHTML = myHtml;

    var enHtml = '';
    for (var j = 0; j < Z.CELL_COUNT; j++) {
      var ecls = 'cell' + (canBomb ? ' clickable' : '');
      var e = state.enemy[j];
      if (e) {
        ecls = 'cell hit ' + (e === 'E' ? 'miss' : e === 'B' ? 'body-hit' : 'head-hit');
      }
      enHtml += '<div class="' + ecls + '" data-idx="' + j + '"></div>';
    }
    el.enemyBoard.innerHTML = enHtml;

    el.myScore.textContent = '机头 ' + state.computerHeads + '/3';
    el.enemyScore.textContent = '机头 ' + state.playerHeads + '/3';
    renderLog();
  }

  function renderStatus() {
    if (state.turn === 'player') {
      el.statusBar.innerHTML = '轮到<span class="turn">你</span>了 —— 点击敌方棋盘进行轰炸';
    } else {
      el.statusBar.innerHTML = '<span class="turn">电脑</span>思考中…';
    }
  }

  function addLog(side, text, cls) {
    state.log.push({ side: side, text: text, cls: cls || '' });
    if (state.log.length > 60) state.log.shift();
    renderLog();
  }

  function renderLog() {
    var html = '';
    for (var i = state.log.length - 1; i >= 0; i--) {
      var l = state.log[i];
      html += '<div><span class="' + l.side + ' ' + l.cls + '">' + l.text + '</span></div>';
    }
    el.log.innerHTML = html;
  }

  function resultText(r) {
    if (r === 'E') return '未击中';
    if (r === 'B') return '击中机身';
    return '击中机头！';
  }
  function resultClass(r) { return r === 'H' ? 'red' : ''; }

  function startBattle() {
    state.phase = 'battle';
    state.adapter = new Z.Adapter();
    state.ai = new Z.PlayerBoardAI('normal');
    state.playerHeads = 0;
    state.computerHeads = 0;
    state.enemy = {};
    state.mine = {};
    state.log = [];
    state.turn = Math.random() < 0.5 ? 'player' : 'computer';
    el.layoutPhase.style.display = 'none';
    el.battlePhase.style.display = 'block';
    addLog('me', '战斗开始' + (state.turn === 'player' ? '，你先行。' : '，电脑先行。'), '');
    renderBattle();
    renderStatus();
    if (state.turn === 'computer') scheduleComputer();
  }

  function playerBomb(idx) {
    if (state.phase !== 'battle' || state.turn !== 'player' || state.busy) return;
    if (state.enemy[idx]) return;
    var res = state.adapter.answer(idx);
    state.enemy[idx] = res;
    if (res === 'H') state.playerHeads++;
    addLog('me', '你轰炸 ' + label(idx) + ' → ' + resultText(res), resultClass(res));
    if (state.playerHeads >= 3) { renderBattle(); endGame(true); return; }
    state.turn = 'computer';
    renderBattle();
    renderStatus();
    scheduleComputer();
  }

  function scheduleComputer() {
    state.busy = true;
    setTimeout(computerBomb, 650);
  }

  function computerBomb() {
    if (state.phase !== 'battle') { state.busy = false; return; }
    var idx = state.ai.choose();
    var res = Z.resultForBoard(idx, state.planes);
    state.mine[idx] = res;
    state.ai.observe(idx, res);
    if (res === 'H') state.computerHeads++;
    addLog('cpu', '电脑轰炸 ' + label(idx) + ' → ' + resultText(res), resultClass(res));
    if (state.computerHeads >= 3) { state.busy = false; renderBattle(); endGame(false); return; }
    state.turn = 'player';
    state.busy = false;
    renderBattle();
    renderStatus();
  }

  function endGame(playerWon) {
    state.phase = 'over';
    el.resultEmoji.textContent = playerWon ? '🎉' : '💥';
    el.resultTitle.textContent = playerWon ? '你赢了！' : '电脑赢了';
    el.resultDetail.textContent = playerWon
      ? '你率先击落了对方 3 架飞机的机头。'
      : '电脑率先击落了你 3 架飞机的机头。';
    el.overlay.classList.remove('hidden');
  }

  // ---- layout interactions ----
  el.layoutBoard.addEventListener('click', function (e) {
    var cell = e.target.closest('.cell');
    if (!cell) return;
    var idx = Number(cell.dataset.idx);
    var map = planeCellMap(state.planes);
    if (map[idx]) state.selected = map[idx].plane;
    renderLayout();
  });

  var MOVE = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
  function applyMove(dir) {
    if (state.phase !== 'layout') return;
    var d = MOVE[dir];
    var next = Z.movePlane(state.planes, state.selected, d[0], d[1]);
    if (next) { state.planes = next; renderLayout(); }
  }
  function applyRotate() {
    if (state.phase !== 'layout') return;
    var next = Z.rotatePlane(state.planes, state.selected);
    if (next) { state.planes = next; renderLayout(); }
  }

  document.querySelectorAll('[data-move]').forEach(function (b) {
    b.addEventListener('click', function () { applyMove(b.dataset.move); });
  });
  document.getElementById('rotateBtn').addEventListener('click', applyRotate);

  window.addEventListener('keydown', function (e) {
    if (state.phase !== 'layout') return;
    if (e.key === 'ArrowUp') { e.preventDefault(); applyMove('up'); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); applyMove('down'); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); applyMove('left'); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); applyMove('right'); }
    else if (e.key === 'r' || e.key === 'R') { applyRotate(); }
  });

  document.getElementById('randomBtn').addEventListener('click', function () {
    state.planes = Z.randomLayout();
    state.selected = 0;
    renderLayout();
  });

  document.getElementById('confirmBtn').addEventListener('click', function () {
    if (state.planes.length !== Z.PLANE_COUNT) { alert('请摆放 3 架飞机'); return; }
    if (Z.hasOverlap(state.planes)) { alert('飞机之间有重叠，请先移动或旋转到不重叠的位置再确认'); return; }
    startBattle();
  });

  el.enemyBoard.addEventListener('click', function (e) {
    var cell = e.target.closest('.cell');
    if (!cell) return;
    playerBomb(Number(cell.dataset.idx));
  });

  document.getElementById('againBtn').addEventListener('click', resetToLayout);

  initBoardLabels();
  resetToLayout();
})();
</script>
</body>
</html>
